name: native-sch-devtools
on:
  push:
    branches: [feat/revb-native-power-safety-dac]
    paths: [.github/workflows/native-sch-devtools.yml]
  pull_request:
    paths: [.github/workflows/native-sch-devtools.yml]
permissions:
  contents: read
jobs:
  assets:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Package KiCad native footprint and schema assets
        run: |
          mkdir -p .devtools
          docker run --rm -v "$PWD/.devtools:/out" debian:trixie-slim bash -euxc '
            apt-get update
            apt-get install -y --no-install-recommends kicad kicad-footprints
            tar -C /usr/share/kicad -czf /out/kicad-assets.tar.gz footprints schemas template
          '
      - uses: actions/upload-artifact@v4
        with:
          name: kicad-offline-assets
          path: .devtools/kicad-assets.tar.gz
          retention-days: 2
