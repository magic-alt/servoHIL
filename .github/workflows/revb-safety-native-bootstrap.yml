name: revb-safety-native-bootstrap
# Temporary, branch-scoped object transport. NEVER moves a branch or commits.
# Delete this workflow when the reviewed native blobs have been committed.
on:
  push:
    branches: [feat/revb-hardware-safety-chain]
    paths:
      - tools/migrations/pr21_native_safety.py
      - tools/migrations/pr21_finish_native.py
      - tools/check_native_safety.py
      - tests/test_native_safety.py
      - .github/workflows/revb-safety-native-bootstrap.yml
permissions:
  contents: read
jobs:
  prepare-native-objects:
    if: github.repository == 'magic-alt/servoHIL' && github.ref == 'refs/heads/feat/revb-hardware-safety-chain'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Explicit one-shot authoring in disposable checkout
        run: |
          mkdir -p build/bootstrap
          python tools/migrations/pr21_native_safety.py --author-native
      - name: Install actual KiCad and ngspice
        run: |
          sudo add-apt-repository --yes ppa:kicad/kicad-10.0-releases >/tmp/ppa.log 2>&1
          sudo apt-get update >/tmp/apt-update.log 2>&1
          sudo apt-get install -y --no-install-recommends kicad kicad-symbols kicad-footprints ngspice >/tmp/apt-install.log 2>&1
          kicad-cli version > build/bootstrap/kicad-version.txt
      - name: Apply reviewed ERC, package and readability corrections
        run: python tools/migrations/pr21_finish_native.py --apply
      - name: Actual native netlist, independent pin and frozen-delta checks
        run: |
          native=hardware/kicad/revB/axu2cgb_expansion
          kicad-cli sch export netlist --format kicadxml -o build/bootstrap/netlist.xml "$native/servohil_io_revB.kicad_sch" > build/bootstrap/export.log 2>&1
          cat build/bootstrap/export.log
          if grep -qi 'annotation errors' build/bootstrap/export.log; then exit 1; fi
          python tools/check_native_readability.py --normalize build/bootstrap/netlist.xml --output build/bootstrap/canonical.xml
          python tools/verify_native_all.py build/bootstrap/canonical.xml --stage supervision
          python tools/check_revb_netlist.py build/bootstrap/canonical.xml "$native/expected_connections.json"
          python tools/check_native_safety.py build/bootstrap/canonical.xml > build/bootstrap/safety.json
          NATIVE_NETLIST=build/bootstrap/canonical.xml python -m unittest discover -s tests -v > build/bootstrap/tests.log 2>&1
          tail -8 build/bootstrap/tests.log
      - name: Actual ERC without suppression
        run: |
          kicad-cli sch erc --format json --exit-code-violations -o build/bootstrap/erc.json hardware/kicad/revB/axu2cgb_expansion/servohil_io_revB.kicad_sch
          python tools/check_revb_erc.py build/bootstrap/erc.json
      - name: Publish only allowlisted immutable blobs, no ref updates
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64, hashlib, json, os, pathlib, subprocess, urllib.request
          if os.environ['GITHUB_REPOSITORY'] != 'magic-alt/servoHIL' or os.environ['GITHUB_REF'] != 'refs/heads/feat/revb-hardware-safety-chain':
              raise SystemExit('branch/repository guard')
          prefix='hardware/kicad/revB/axu2cgb_expansion/'
          names=['50_watchdog_interlock.kicad_sch','60_dut_permit.kicad_sch','06_analog_outputs.kicad_sch','40_power_supervision.kicad_sch','servohil_io_revB.kicad_sch','safety.kicad_sym','sym-lib-table','expected_connections.json','footprints/Capacitor_SMD.pretty/C_0603_1608Metric.kicad_mod','footprints/Package_SO.pretty/TSSOP-16_4.4x5mm_P0.65mm.kicad_mod']
          allowed={prefix+n for n in names}
          changed=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          untracked=set(subprocess.check_output(['git','ls-files','--others','--exclude-standard',prefix],text=True).splitlines())
          if (changed|untracked)-allowed: raise SystemExit('unexpected source delta')
          manifest={'scope':'PRECOMMIT_SCRATCH_ONLY_NOT_HEAD_EVIDENCE','parent_source':os.environ['GITHUB_SHA'],'files':[]}
          for path in sorted(allowed):
              data=pathlib.Path(path).read_bytes()
              payload=json.dumps({'content':base64.b64encode(data).decode(),'encoding':'base64'}).encode()
              request=urllib.request.Request('https://api.github.com/repos/magic-alt/servoHIL/git/blobs',data=payload,method='POST',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','Content-Type':'application/json'})
              with urllib.request.urlopen(request,timeout=60) as response: result=json.load(response)
              expected=hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
              if result['sha']!=expected:raise SystemExit('blob mismatch: '+path)
              manifest['files'].append({'path':path,'sha':expected,'sha256':hashlib.sha256(data).hexdigest(),'bytes':len(data)})
          pathlib.Path('build/bootstrap/objects.json').write_text(json.dumps(manifest,indent=2)+'\n')
          PY
      - name: Retain exact scratch source and review output
        if: always()
        run: |
          mkdir -p build/bootstrap
          kicad-cli sch export pdf -o build/bootstrap/schematic-review.pdf hardware/kicad/revB/axu2cgb_expansion/servohil_io_revB.kicad_sch || true
          python - <<'PY'
          import pathlib,zipfile
          with zipfile.ZipFile('build/bootstrap/native-source.zip','w',zipfile.ZIP_DEFLATED) as z:
              for p in sorted(pathlib.Path('hardware/kicad/revB/axu2cgb_expansion').rglob('*')):
                  if p.is_file():z.write(p,p.as_posix())
          PY
          git rev-parse HEAD > build/bootstrap/parent_source.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: revb-safety-precommit-native
          path: build/bootstrap/
          if-no-files-found: error
