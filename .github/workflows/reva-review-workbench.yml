name: reva-review-workbench
# One-shot PR #18 repair transport. Removed after completion.
on:
  push:
    branches: [fix/reva-kicad-connectivity]
    paths: ['.github/workflows/reva-review-workbench.yml']
permissions:
  contents: write
concurrency:
  group: reva-reviewed-edit
  cancel-in-progress: false
jobs:
  apply-reviewed-edit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Install native KiCad
        run: |
          sudo add-apt-repository --yes ppa:kicad/kicad-10.0-releases
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends kicad kicad-symbols
      - name: Reproduce thirteen disconnected digital-power nodes
        run: |
          mkdir -p build/reva-edit
          native=archive/revA/snapshot/hardware/kicad/revA
          kicad-cli sch export netlist --format kicadxml -o build/reva-edit/before.xml "$native/servohil_io_revA.kicad_sch"
          set +e
          python archive/revA/validation/check_pin_contract.py build/reva-edit/before.xml --sheet 03_digital_power.kicad_sch > build/reva-edit/red.json
          code=$?
          set -e
          test "$code" = 1
          python - <<'PY'
          import json
          r=json.load(open('build/reva-edit/red.json'))
          assert len(r['issues'])==13 and all(i['kind']=='split' for i in r['issues']), r
          print('RED: 13 physical pin groups disconnected')
          PY
      - name: Restore the reviewed divider and output node identities
        run: |
          python - <<'PY'
          import uuid
          from pathlib import Path
          p=Path('archive/revA/snapshot/hardware/kicad/revA/03_digital_power.kicad_sch')
          text=p.read_text().rstrip(); assert text.endswith(')')
          points=[('SEQ_RC',57.15,77.47)]
          points += [(n,266.7,y) for n,y in zip(['MON_1V0','MON_1V8','MON_3V3','MON_6V0'],[38.1,49.53,62.23,73.66])]
          points += [(n,355.6,y) for n,y in zip(['1V0_FPGA','6V0_PRE','1V8_D','3V3_D'],[156.21,173.99,191.77,209.55])]
          points += [(n,391.16,y) for n,y in zip(['FB1','FB2','FB3','FB4'],[156.21,173.99,191.77,209.55])]
          extra=[]
          for n,x,y in points:
              uid=uuid.uuid5(uuid.NAMESPACE_URL,f'servoHIL/revA/repair03/{n}')
              extra.append(f'  (label "{n}" (at {x} {y} 0) (effects (font (size 1.27 1.27)) (justify left bottom)) (uuid "{uid}"))')
          p.write_text(text[:-1]+'\n'+'\n'.join(extra)+'\n)\n')
          PY
          native=archive/revA/snapshot/hardware/kicad/revA
          kicad-cli sch export netlist --format kicadxml -o build/reva-edit/after.xml "$native/servohil_io_revA.kicad_sch"
          python archive/revA/validation/check_pin_contract.py build/reva-edit/after.xml --sheet 03_digital_power.kicad_sch | tee build/reva-edit/green.json
          kicad-cli sch erc --format json --severity-all -o build/reva-edit/erc.json "$native/servohil_io_revA.kicad_sch"
          python - <<'PY'
          import json
          r=json.load(open('build/reva-edit/erc.json'))
          errors=[v for s in r['sheets'] for v in s['violations'] if v['severity']=='error']
          assert not errors, errors
          print('Native ERC: zero errors; warnings retained for following review')
          PY
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add archive/revA/snapshot/hardware/kicad/revA/03_digital_power.kicad_sch
          git commit -m 'fix(revA): reconnect thirteen digital-power feedback and output nodes'
          git push origin HEAD:fix/reva-kicad-connectivity
          git rev-parse HEAD > build/reva-edit/source_commit.txt
      - name: Export original main intent and complete offline ERC support
        if: always()
        run: |
          native=archive/revA/snapshot/hardware/kicad/revA
          mkdir -p build/reva-edit/main
          git archive origin/main archive/revA | tar -x -C build/reva-edit/main
          kicad-cli sch export netlist --format kicadxml -o build/reva-edit/main-netlist.xml "build/reva-edit/main/$native/servohil_io_revA.kicad_sch"
          git archive --format=zip -o build/reva-edit/source.zip HEAD archive/revA tools tests
          mkdir -p build/reva-edit/extra/lib build/reva-edit/extra/share
          python - <<'PY'
          import pathlib,re,shutil,subprocess
          dst=pathlib.Path('build/reva-edit/extra')
          libs=set()
          for p in pathlib.Path('/usr/bin').glob('*kiface'):
              shutil.copy2(p,dst/'lib'/p.name,follow_symlinks=True)
              r=subprocess.run(['ldd',str(p)],capture_output=True,text=True,check=True)
              libs.update(re.findall(r'(/[^\s()]+)',r.stdout))
          for value in libs:
              p=pathlib.Path(value)
              if p.is_file():shutil.copy2(p,dst/'lib'/p.name,follow_symlinks=True)
          shutil.copytree('/usr/share/kicad/schemas',dst/'share/schemas')
          PY
          tar -C build/reva-edit -czf build/reva-erc-support.tar.gz extra
          rm -rf build/reva-edit/extra
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reva-digital-power-repair
          path: build/reva-edit/
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reva-erc-support
          path: build/reva-erc-support.tar.gz
          if-no-files-found: error
          retention-days: 1
