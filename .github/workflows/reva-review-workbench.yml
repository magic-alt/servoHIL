name: reva-review-workbench
# One-shot, branch-specific reviewed edit. Remove after the three review phases.
on:
  push:
    branches: [fix/reva-kicad-connectivity]
    paths: ['.github/workflows/reva-review-workbench.yml']
permissions:
  contents: write
concurrency:
  group: reva-reviewed-edit
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  apply-reviewed-edit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Confirm current main is already included
        run: |
          mkdir -p build/reva-phase1
          git merge-base --is-ancestor origin/main HEAD
          git rev-parse origin/main > build/reva-phase1/main-commit.txt
      - name: Install independent native exporter
        run: |
          sudo add-apt-repository --yes ppa:kicad/kicad-10.0-releases
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends kicad kicad-symbols
          kicad-cli version | tee build/reva-phase1/kicad-version.txt
      - name: Reproduce remaining global-interface failures
        run: |
          set +e
          REVA_STAGE=power python archive/revA/validation/test_interface_wiring.py > build/reva-phase1/red.txt 2>&1
          code=$?
          set -e
          test "$code" = 1
          grep -q 'test_digital_power_has_no_global_labels' build/reva-phase1/red.txt
      - name: Apply phase 1 power hierarchy
        run: python archive/revA/validation/_migrate_interfaces.py
      - name: Read-only drawing and native electrical validation
        run: |
          native=archive/revA/snapshot/hardware/kicad/revA
          REVA_STAGE=power python archive/revA/validation/test_interface_wiring.py 2>&1 | tee build/reva-phase1/hierarchy-tests.txt
          python archive/revA/validation/test_digital_drawing.py 2>&1 | tee build/reva-phase1/digital-tests.txt
          kicad-cli sch export netlist --format kicadxml -o build/reva-phase1/netlist.xml "$native/servohil_io_revA.kicad_sch"
          python archive/revA/validation/check_pin_contract.py build/reva-phase1/netlist.xml | tee build/reva-phase1/pin-contract.json
          python - <<'PY'
          import json,sys
          sys.path.insert(0,'tools')
          from check_native_readability import graph
          actual=graph('build/reva-phase1/netlist.xml')
          expected=json.load(open('archive/revA/validation/native_pin_contract.json'))['graph']
          assert actual==expected,'Native component/pin partition differs from original main'
          result={'result':'ELECTRICALLY_EQUIVALENT','components':len(actual['components']),'nets':len(actual['partition']),'pins':sum(map(len,actual['partition']))}
          json.dump(result,open('build/reva-phase1/equivalence.json','w'),indent=2)
          print(result)
          PY
          kicad-cli sch erc --format json --severity-all -o build/reva-phase1/erc.json "$native/servohil_io_revA.kicad_sch"
          kicad-cli sch export svg -o build/reva-phase1/svg/ "$native/servohil_io_revA.kicad_sch"
          python - <<'PY'
          import json,collections
          r=json.load(open('build/reva-phase1/erc.json'))
          violations=[v for s in r['sheets'] for v in s['violations']]
          counts=collections.Counter(v['severity']+':'+v['type'] for v in violations)
          json.dump(dict(counts),open('build/reva-phase1/erc-counts.json','w'),indent=2)
          print(counts)
          assert not [v for v in violations if v['severity']=='error']
          PY
          git diff --check
      - name: Commit phase 1 native files immediately
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add archive/revA/snapshot/hardware/kicad/revA/*.kicad_sch
          git commit -m 'fix(revA): phase 1 replace digital power globals with explicit hierarchy'
          git push origin HEAD:fix/reva-kicad-connectivity
          git rev-parse HEAD > build/reva-phase1/source_commit.txt
      - name: Capture source and native evidence
        if: always()
        run: |
          git diff > build/reva-phase1/uncommitted.patch
          git archive --format=zip -o build/reva-phase1/source.zip HEAD
          tar -czf build/reva-phase1/native-working-copy.tar.gz archive/revA/snapshot/hardware/kicad/revA
          git bundle create build/reva-phase1/review.bundle HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reva-phase1-power-hierarchy
          path: build/reva-phase1/
          retention-days: 14
