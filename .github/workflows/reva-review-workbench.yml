name: reva-review-workbench
# Final one-shot cleanup: deletes itself and all temporary drawing generators.
on:
  push:
    branches: [fix/reva-kicad-connectivity]
    paths: ['.github/workflows/reva-review-workbench.yml']
permissions:
  contents: write
concurrency:
  group: reva-reviewed-edit
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  handoff:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Preserve the independently verified native source exactly
        run: |
          mkdir -p build/reva-handoff
          git merge-base --is-ancestor origin/main HEAD
          python - <<'PY'
          import hashlib,json,subprocess
          from pathlib import Path
          base='846ce4a285e4c31f3840e6058e376be4b8a25a84'
          native=Path('archive/revA/snapshot/hardware/kicad/revA')
          files=sorted(p for p in native.iterdir() if p.suffix in ('.kicad_sch','.kicad_sym','.kicad_pro') or p.name in ('sym-lib-table','fp-lib-table'))
          manifest={}
          for p in files:
              assert p.read_bytes()==subprocess.check_output(['git','show',base+':'+p.as_posix()]),p
              manifest[p.as_posix()]=hashlib.sha256(p.read_bytes()).hexdigest()
          result={'native_source_commit':base,'sha256':manifest,'validation_run':35982150393}
          Path('build/reva-handoff/native-source-manifest.json').write_text(json.dumps(result,indent=2)+'\n')
          Path('archive/revA/validation/native-source-2026-09-24.json').write_text(json.dumps(result,indent=2)+'\n')
          PY
      - name: Retire temporary generators and refresh archive entry points
        run: |
          python - <<'PY'
          from pathlib import Path
          base=Path('archive/revA')
          for name in ('_apply_reviewed_dac_layout.py','_apply_digital_drawing.py','_migrate_interfaces.py','_wire_fpga_local.py','_finish_review.py','_freeze_ground_library.py'):
              (base/'validation'/name).unlink()
          Path('.github/workflows/reva-review-workbench.yml').unlink()
          (base/'README.md').write_text('''# Rev.A historical design — reviewed native KiCad source

          This is the archived dual-FPGA design, not the active Rev.B product.
          The original snapshot came from commit `dbd0d32a030bcda0427fec31894c01db29717d8a`,
          tree `6ddd828a8b7ca289a4f2acfee7eb2e1f07569e2e`; PR #18 intentionally repairs its native drawings.
          The original immutable bytes remain in Git history.

          Open `snapshot/hardware/kicad/revA/servohil_io_revA.kicad_pro` with the complete project.
          All eight sheets have zero Global Label objects. Cross-sheet signals use explicit hierarchical interfaces;
          same-sheet configuration, digital-power and safety circuits use continuous wires.

          [2026-09-24 verified handoff](validation/2026-09-24-pr18-handoff.md) records the three native commits,
          133 matched hierarchy pins, independent pin equivalence and KiCad 10.0.6 ERC: 0 errors / 0 warnings / 0 exclusions.
          It also records the separate failing immutable-archive guard and remaining electrical/package limitations.
          Earlier review notes are historical, not a current completion claim.

          Native files are editable sources. Temporary generators and the write-enabled workbench were removed;
          normal `reva-native-schematic` CI only validates and exports. Their implementation history remains in Git.
          No PCB/layout/fabrication release is authorized. Active new hardware development remains Rev.B.
          '''.replace('\n          ','\n'))
          (base/'snapshot/hardware/kicad/revA/README.md').write_text('''# ServoHIL-I/O Rev.A — editable native KiCad project

          Open `servohil_io_revA.kicad_pro`, then its root schematic. Keep all seven child sheets, project symbol libraries,
          `sym-lib-table` and the project file together. Replacing only the two child files leaves an old root without matching sheet pins.

          ## Reviewed source

          The three native repair commits are `615e1f1` (power interfaces), `9e6f133` (FPGA local wiring and complete hierarchy),
          and `846ce4a` (library reconciliation and zero-warning ERC).
          All eight sheets contain zero Global Label objects; root sheet pins match 133 child interfaces.
          GND remains a global power network, represented by the exact archived symbol in the portable `ServoHILGround` project library.

          [Full handoff and evidence](../../../../validation/2026-09-24-pr18-handoff.md).
          `native-source-2026-09-24.json` is a historical source manifest, not a generator or restriction on future reviewed edits.
          Use KiCad 10.0.6 for reproducing the recorded results; newer versions must be revalidated.

          ## Verification

          Read-only checks and actual native XML equivalence passed: 191 components, 209 nets, 716 physical pins.
          Complete ERC passed with 0 errors, 0 warnings and no exclusions. Twenty-three Rev.A drawing tests passed.
          No temporary generator runs when opening or validating this project.

          ## Not a fabrication release

          FPGA package/ball assignment remains FUNCTIONAL_PRELAYOUT. C230/C231/C232 are bulk capacitors, not a completed per-pin bypass design.
          Power magnetics, compensation, startup, MLCC derating, thermal and hardware safety qualification remain open.
          Legacy AO0..3 sharing between DAC sheets is preserved for pin equivalence, not approved as a product output architecture.
          `layout_gate.yaml` remains unchanged and `layout_allowed` stays false. PCB routing has not been performed by this repair.
          The separate whole-repository immutable-archive check still reports `historical snapshot bytes changed`; it was not disabled.
          '''.replace('\n          ','\n'))
          p=base/'LOCAL_WIRING_REVIEW.md'
          p.write_text('> Historical review log. Current final results and limitations: [2026-09-24 PR18 handoff](validation/2026-09-24-pr18-handoff.md). Earlier label/ERC statements below are superseded.\n\n'+p.read_text())
          PY
      - name: Revalidate after removal and prove native files unchanged
        run: |
          python -m unittest discover -s archive/revA/validation -p 'test*.py' -v 2>&1 | tee build/reva-handoff/tests.txt
          python archive/revA/validation/check_sheet_pin_sides.py | tee build/reva-handoff/sheet-pins.json
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          for p,expected in json.load(open('build/reva-handoff/native-source-manifest.json'))['sha256'].items():
              assert hashlib.sha256(Path(p).read_bytes()).hexdigest()==expected,p
          assert not Path('.github/workflows/reva-review-workbench.yml').exists()
          assert not list(Path('archive/revA/validation').glob('_*.py'))
          PY
          git diff --check
      - name: Commit verified handoff on the same PR branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add archive/revA .github/workflows/reva-review-workbench.yml
          git commit -m 'chore(revA): hand off editable native sources and retire one-shot generators'
          git push origin HEAD:fix/reva-kicad-connectivity
          git rev-parse HEAD > build/reva-handoff/source_commit.txt
          git archive --format=zip -o build/reva-handoff/source.zip HEAD
          git bundle create build/reva-handoff/review.bundle HEAD
          git status --porcelain > build/reva-handoff/worktree-status.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reva-source-handoff
          path: build/reva-handoff/
          retention-days: 14
