name: reva-review-workbench
# One-shot reviewed edit; remove after final source/evidence review.
on:
  push:
    branches: [fix/reva-kicad-connectivity]
    paths: ['.github/workflows/reva-review-workbench.yml']
permissions:
  contents: write
concurrency:
  group: reva-reviewed-edit
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  apply-reviewed-edit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      KICAD10_SYMBOL_DIR: /usr/share/kicad/symbols
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Confirm phase 2 and main are preserved
        run: |
          mkdir -p build/reva-final
          git merge-base --is-ancestor origin/main HEAD
          git merge-base --is-ancestor 9e6f1331e24bbc65cfa14ed3631e14e5bfd85512 HEAD
          git rev-parse origin/main > build/reva-final/main-commit.txt
      - name: Install and configure real KiCad libraries
        run: |
          sudo add-apt-repository --yes ppa:kicad/kicad-10.0-releases
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends kicad kicad-symbols ngspice
          mkdir -p "$HOME/.config/kicad/10.0"
          cp /usr/share/kicad/template/sym-lib-table "$HOME/.config/kicad/10.0/sym-lib-table"
          kicad-cli version | tee build/reva-final/kicad-version.txt
      - name: Reproduce drawing and ground-library regressions
        run: |
          set +e
          python archive/revA/validation/test_review_finish.py > build/reva-final/red.txt 2>&1
          code=$?
          python archive/revA/validation/test_ground_library.py > build/reva-final/ground-red.txt 2>&1
          ground_code=$?
          set -e
          test "$code" = 1
          test "$ground_code" = 1
          grep -q 'FAIL: test_root_wires_have_no_unterminated_tails' build/reva-final/red.txt
          kicad-cli sch erc --format json --severity-all -o build/reva-final/erc-before.json archive/revA/snapshot/hardware/kicad/revA/servohil_io_revA.kicad_sch
          python - <<'PY'
          import sys,json
          from pathlib import Path
          sys.path[:0]=['tools','archive/revA/validation']
          from kicad_sexpr import parse,items,one,walk,dump
          from test_digital_drawing import NATIVE
          old=next(s for s in items(one(parse((NATIVE/'01_power_entry.kicad_sch').read_text()),'lib_symbols'),'symbol') if s[1]=='power:GND')
          new=next(s for s in items(parse(Path('/usr/share/kicad/symbols/power.kicad_sym').read_text()),'symbol') if s[1]=='GND')
          sig=lambda s:[(one(p,'number')[1],one(p,'name')[1],p[1],p[2]) for p in walk(s,'pin')]
          result={'original_pin_signature':sig(old),'installed_pin_signature':sig(new),'action':'Preserve exact original under project-owned ServoHILGround:GND; no pin-type changes.'}
          json.dump(result,open('build/reva-final/ground-library-review.json','w'),indent=2)
          print(result)
          Path('build/reva-final/installed-ground-definition.txt').write_text(dump(new)+'\n')
          PY
      - name: Apply geometry library reconciliation and exact original ground copy
        run: |
          python archive/revA/validation/_finish_review.py
          python archive/revA/validation/_freeze_ground_library.py
      - name: Full drawing regressions and native pin equivalence
        run: |
          python -m unittest discover -s archive/revA/validation -p 'test*.py' -v 2>&1 | tee build/reva-final/reva-tests.txt
          python archive/revA/validation/check_sheet_pin_sides.py | tee build/reva-final/sheet-pins.json
          native=archive/revA/snapshot/hardware/kicad/revA
          kicad-cli sch export netlist --format kicadxml -o build/reva-final/netlist.xml "$native/servohil_io_revA.kicad_sch"
          python archive/revA/validation/check_pin_contract.py build/reva-final/netlist.xml | tee build/reva-final/pin-contract.json
          python - <<'PY'
          import json,sys
          sys.path.insert(0,'tools')
          from check_native_readability import graph
          actual=graph('build/reva-final/netlist.xml')
          assert actual==json.load(open('archive/revA/validation/native_pin_contract.json'))['graph']
          result={'result':'ELECTRICALLY_EQUIVALENT','components':len(actual['components']),'nets':len(actual['partition']),'pins':sum(map(len,actual['partition']))}
          json.dump(result,open('build/reva-final/equivalence.json','w'),indent=2)
          print(result)
          PY
      - name: Complete native ERC with no exclusions
        run: |
          kicad-cli sch erc --format json --severity-all --exit-code-violations -o build/reva-final/erc.json archive/revA/snapshot/hardware/kicad/revA/servohil_io_revA.kicad_sch
          python - <<'PY'
          import json
          report=json.load(open('build/reva-final/erc.json'))
          violations=[v for s in report['sheets'] for v in s['violations']]
          assert not violations,violations
          json.dump({'errors':0,'warnings':0,'exclusions':0,'result':'PASS'},open('build/reva-final/erc-summary.json','w'),indent=2)
          PY
      - name: Run full current repository unit suite with native RevB XML and ngspice
        run: |
          kicad-cli sch export netlist --format kicadxml -o build/reva-final/revb.xml hardware/kicad/revB/axu2cgb_expansion/servohil_io_revB.kicad_sch
          python tools/check_native_readability.py --normalize build/reva-final/revb.xml --output build/reva-final/revb-canonical.xml
          NATIVE_NETLIST=build/reva-final/revb-canonical.xml python -m unittest discover -s tests -v 2>&1 | tee build/reva-final/full-tests.txt
          python .github/scripts/test_verification_sync.py 2>&1 | tee build/reva-final/verification-sync-tests.txt
      - name: Export all native review pages
        if: always()
        run: kicad-cli sch export svg -o build/reva-final/svg/ archive/revA/snapshot/hardware/kicad/revA/servohil_io_revA.kicad_sch
      - name: Commit phase 3 native corrections immediately
        run: |
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add archive/revA/snapshot/hardware/kicad/revA/*.kicad_sch archive/revA/snapshot/hardware/kicad/revA/*.kicad_sym archive/revA/snapshot/hardware/kicad/revA/sym-lib-table archive/revA/validation/test_digital_drawing.py
          git commit -m 'fix(revA): phase 3 reconcile symbol libraries and clear native ERC drawing warnings'
          git push origin HEAD:fix/reva-kicad-connectivity
          git rev-parse HEAD > build/reva-final/source_commit.txt
      - name: Record separate legacy archive immutability gate without weakening it
        if: always()
        run: |
          set +e
          python tools/check_revb_repository.py > build/reva-final/legacy-archive-guard.txt 2>&1
          echo "$?" > build/reva-final/legacy-archive-guard.exit
          set -e
          cat build/reva-final/legacy-archive-guard.txt
      - name: Capture exact source and evidence
        if: always()
        run: |
          git diff > build/reva-final/uncommitted.patch
          git archive --format=zip -o build/reva-final/source.zip HEAD
          tar -czf build/reva-final/native-working-copy.tar.gz archive/revA/snapshot/hardware/kicad/revA
          git bundle create build/reva-final/review.bundle HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reva-final-native-review
          path: build/reva-final/
          retention-days: 14
