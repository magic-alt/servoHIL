name: revb-peripheral-workbench
# One-shot authoring in a disposable checkout, NOT normal native-source CI.
# Publishes immutable blobs only; NEVER creates commits or moves branches.
# Remove this workflow and authoring helpers when reviewed native files land.
on:
  push:
    branches: [feat/revb-adc-phy-health]
    paths:
      - tools/migrations/pr22_*.py
      - tools/native_peripheral_rules.py
      - tests/test_native_peripherals.py
      - .github/workflows/revb-peripheral-workbench.yml
permissions:
  contents: read
jobs:
  author-and-verify:
    if: github.repository == 'magic-alt/servoHIL' && github.ref == 'refs/heads/feat/revb-adc-phy-health'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install real KiCad and simulators
        run: |
          sudo add-apt-repository --yes ppa:kicad/kicad-10.0-releases >/tmp/ppa.log 2>&1
          sudo apt-get update >/tmp/update.log 2>&1
          sudo apt-get install -y --no-install-recommends kicad kicad-symbols kicad-footprints iverilog ngspice >/tmp/install.log 2>&1
          mkdir -p build/peripheral-review
          kicad-cli version > build/peripheral-review/kicad-version.txt
          iverilog -V > build/peripheral-review/iverilog-version.txt 2>&1
      - name: Explicit native authoring and narrow verifier delta
        run: |
          python tools/migrations/pr22_author.py --author-native
          python tools/migrations/pr22_checks.py --apply
      - name: Actual netlist and independent electrical checks
        run: |
          native=hardware/kicad/revB/axu2cgb_expansion
          kicad-cli sch export netlist --format kicadxml -o build/peripheral-review/netlist.xml "$native/servohil_io_revB.kicad_sch" > build/peripheral-review/export.log 2>&1
          cat build/peripheral-review/export.log
          if grep -qi 'annotation errors' build/peripheral-review/export.log; then exit 1; fi
          python tools/check_native_readability.py --normalize build/peripheral-review/netlist.xml --output build/peripheral-review/canonical.xml
          python tools/check_native_readability.py > build/peripheral-review/labels.json
          python tools/verify_native_all.py build/peripheral-review/canonical.xml --stage supervision
          python tools/check_revb_netlist.py build/peripheral-review/canonical.xml "$native/expected_connections.json"
          python tools/check_native_safety.py build/peripheral-review/canonical.xml > build/peripheral-review/pins.json
          NATIVE_NETLIST=build/peripheral-review/canonical.xml python -m unittest discover -s tests -v > build/peripheral-review/tests.log 2>&1
          tail -15 build/peripheral-review/tests.log
      - name: Native ERC without exclusions
        run: |
          kicad-cli sch erc --format json --exit-code-violations -o build/peripheral-review/erc.json hardware/kicad/revB/axu2cgb_expansion/servohil_io_revB.kicad_sch
          python tools/check_revb_erc.py build/peripheral-review/erc.json
      - name: Publish allowlisted immutable native blobs only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64, hashlib, json, os, pathlib, subprocess, urllib.request
          if os.environ['GITHUB_REPOSITORY']!='magic-alt/servoHIL' or os.environ['GITHUB_REF']!='refs/heads/feat/revb-adc-phy-health':
              raise SystemExit('repository/branch guard')
          prefix='hardware/kicad/revB/axu2cgb_expansion/'
          names=['03_peripheral_boundaries.kicad_sch','70_adc_frontend.kicad_sch','80_encoder_phy.kicad_sch','servohil_io_revB.kicad_sch','peripherals.kicad_sym','sym-lib-table','fp-lib-table','expected_connections.json']
          allowed={prefix+n for n in names}|{'tools/check_native_safety.py','.github/workflows/native-schematic-readability.yml'}
          changed=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          untracked=set(subprocess.check_output(['git','ls-files','--others','--exclude-standard',prefix],text=True).splitlines())
          footprints={p for p in untracked if p.startswith(prefix+'footprints/') and p.endswith('.kicad_mod')}
          allowed|=footprints
          if (changed|untracked)-allowed:raise SystemExit('unexpected source delta')
          manifest={'scope':'PRECOMMIT_SCRATCH_NOT_HEAD_EVIDENCE','parent_source':os.environ['GITHUB_SHA'],'files':[]}
          for path in sorted(allowed):
              data=pathlib.Path(path).read_bytes()
              payload=json.dumps({'content':base64.b64encode(data).decode(),'encoding':'base64'}).encode()
              request=urllib.request.Request('https://api.github.com/repos/magic-alt/servoHIL/git/blobs',data=payload,method='POST',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json','X-GitHub-Api-Version':'2022-11-28'})
              with urllib.request.urlopen(request,timeout=60) as response:result=json.load(response)
              sha=hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
              if result['sha']!=sha:raise SystemExit('blob transport mismatch: '+path)
              manifest['files'].append({'path':path,'sha':sha,'sha256':hashlib.sha256(data).hexdigest(),'bytes':len(data)})
          pathlib.Path('build/peripheral-review/objects.json').write_text(json.dumps(manifest,indent=2)+'\n')
          PY
      - name: Preserve exact scratch source and review PDF
        if: always()
        run: |
          mkdir -p build/peripheral-review
          kicad-cli sch export pdf -o build/peripheral-review/schematic-review.pdf hardware/kicad/revB/axu2cgb_expansion/servohil_io_revB.kicad_sch || true
          python - <<'PY'
          import pathlib, subprocess, zipfile
          files=set(subprocess.check_output(['git','ls-files'],text=True).splitlines())
          files|={str(p) for p in pathlib.Path('hardware/kicad/revB/axu2cgb_expansion').rglob('*') if p.is_file()}
          with zipfile.ZipFile('build/peripheral-review/source.zip','w',zipfile.ZIP_DEFLATED) as z:
              for name in sorted(files):
                  if pathlib.Path(name).is_file():z.write(name,name)
          PY
          git rev-parse HEAD > build/peripheral-review/parent_source.txt
          sha256sum build/peripheral-review/source.zip > build/peripheral-review/SHA256SUMS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: revb-peripheral-precommit-review
          path: build/peripheral-review/
          if-no-files-found: error
