name: native-schematic-readability
on:
  push:
    branches: [fix/revb-schematic-wiring-readability, main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: native-readability-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native-review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Source-only schematic regressions
        run: python -m unittest discover -s tests -p test_native_readability.py -v
      - name: Install native KiCad CLI and numerical regression dependency
        run: |
          sudo add-apt-repository --yes ppa:kicad/kicad-10.0-releases >/tmp/ppa.log 2>&1
          sudo apt-get update >/tmp/apt-update.log 2>&1
          sudo apt-get install -y --no-install-recommends kicad kicad-symbols kicad-footprints ngspice >/tmp/apt-install.log 2>&1
          mkdir -p build/readability
          kicad-cli version > build/readability/kicad-version.txt
          ngspice --version > build/readability/ngspice-version.txt
      - name: Local-versus-cross-sheet label policy
        run: |
          python tools/check_native_readability.py --audit-only > build/readability/label-audit.json
          python tools/check_native_readability.py
      - name: Actual native netlist and independent electrical assertions
        run: |
          native=hardware/kicad/revB/axu2cgb_expansion
          kicad-cli sch export netlist --format kicadxml -o build/readability/netlist.xml "$native/servohil_io_revB.kicad_sch" > build/readability/netlist-export.log 2>&1
          cat build/readability/netlist-export.log
          if grep -qi 'annotation errors' build/readability/netlist-export.log; then exit 1; fi
          python tools/check_native_readability.py --normalize build/readability/netlist.xml --output build/readability/canonical.xml
          python tools/verify_native_all.py build/readability/canonical.xml --stage supervision
          python tools/check_revb_netlist.py build/readability/canonical.xml "$native/expected_connections.json"
          NATIVE_NETLIST=build/readability/canonical.xml python -m unittest discover -s tests -v > build/readability/tests.log 2>&1
          tail -20 build/readability/tests.log
      - name: Frozen existing wiring and explicit safety delta
        run: |
          python tools/check_native_safety.py build/readability/canonical.xml > build/readability/safety-delta.json
          cat build/readability/safety-delta.json
      - name: Native ERC - do not suppress warnings
        run: |
          kicad-cli sch erc --format json --exit-code-violations -o build/readability/erc.json hardware/kicad/revB/axu2cgb_expansion/servohil_io_revB.kicad_sch
          python tools/check_revb_erc.py build/readability/erc.json
      - name: Confirm read-only validation did not rewrite hardware
        run: git diff --exit-code -- hardware/kicad/revB/axu2cgb_expansion
      - name: Export review PDF and exact native source
        if: always()
        run: |
          mkdir -p build/readability
          kicad-cli sch export pdf -o build/readability/schematic-review.pdf hardware/kicad/revB/axu2cgb_expansion/servohil_io_revB.kicad_sch
          git rev-parse HEAD > build/readability/source_commit.txt
          git archive --format=zip --output=build/readability/native-source.zip HEAD hardware/kicad/revB/axu2cgb_expansion
          sha256sum build/readability/native-source.zip build/readability/schematic-review.pdf > build/readability/SHA256SUMS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-schematic-readability
          path: build/readability/
          if-no-files-found: error
